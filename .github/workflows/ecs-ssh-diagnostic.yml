name: Temporary ECS SSH diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-banner:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check whether the SSH service returns a banner
        shell: bash
        run: |
          set -euo pipefail
          timeout 15 ssh-keyscan -T 10 -p 22 47.110.8.143 | tee /tmp/ecs-host-keys
          test -s /tmp/ecs-host-keys
