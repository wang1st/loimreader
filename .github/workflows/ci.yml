name: C17 desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LOIM_CI_VERSION: 3.0.3

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: amd64
            runner: windows-2025
          - platform: windows
            arch: arm64
            runner: windows-11-arm
          - platform: macos
            arch: amd64
            runner: macos-26-intel
          - platform: macos
            arch: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libdecor-0-dev libcurl4-openssl-dev \
            fonts-noto-cjk

      - name: Install pinned WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixRoot = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $wixRoot wix --version 4.0.6
          & (Join-Path $wixRoot 'wix.exe') extension add --global WixToolset.UI.wixext/4.0.6
          & (Join-Path $wixRoot 'wix.exe') extension add --global WixToolset.Util.wixext/4.0.6
          $wixRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DLOIM_BUILD_LEGACY_QT=OFF
          -DLOIM_BUILD_DESKTOP=ON
          -DBUILD_TESTING=ON
          -DLOIM_ENABLE_STRICT_WARNINGS=ON
          -DLOIM_VERSION_OVERRIDE=${{ env.LOIM_CI_VERSION }}
          -DLOIM_RELEASE_PLATFORM=${{ matrix.platform }}
          -DLOIM_RELEASE_ARCH=${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix stage/LoimReader

      - name: Reject legacy Qt and Poppler files
        shell: bash
        run: |
          if find stage -type f \( -iname '*qt*' -o -iname '*poppler*' \) | grep -q .; then
            echo 'Legacy Qt/Poppler file found in release stage' >&2
            find stage -type f \( -iname '*qt*' -o -iname '*poppler*' \)
            exit 1
          fi

      - name: Audit Unix runtime dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            binary="$GITHUB_WORKSPACE/stage/LoimReader/LoimReader.app/Contents/MacOS/LoimReader"
          else
            binary="$GITHUB_WORKSPACE/stage/LoimReader/bin/LoimReader"
          fi
          cmake \
            -DLOIM_BINARY="$binary" \
            -DLOIM_STAGE_ROOT="$GITHUB_WORKSPACE/stage/LoimReader" \
            -P scripts/check-runtime-dependencies.cmake

      - name: Audit Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake
          "-DLOIM_BINARY=$env:GITHUB_WORKSPACE/stage/LoimReader/bin/LoimReader.exe"
          "-DLOIM_STAGE_ROOT=$env:GITHUB_WORKSPACE/stage/LoimReader"
          -P scripts/check-runtime-dependencies.cmake

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C stage -czf "dist/LoimReader_${LOIM_CI_VERSION}_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz" LoimReader

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-dist | Out-Null
          cpack --config build/CPackConfig.cmake -C Release -B native-dist
          if ($LASTEXITCODE -ne 0) {
            Get-Content native-dist/_CPack_Packages/win64/WIX/wix.log
            exit $LASTEXITCODE
          }
          $msi = "native-dist/LoimReader_$($env:LOIM_CI_VERSION)_windows_${{ matrix.arch }}.msi"
          ./scripts/package-windows-zip.ps1 `
            -MsiPath $msi `
            -OutputDirectory dist `
            -Version $env:LOIM_CI_VERSION `
            -Architecture '${{ matrix.arch }}' `
            -SourceDirectory $env:GITHUB_WORKSPACE
          ./tests/test_windows_package.ps1 `
            -MsiPath $msi `
            -ZipPath "dist/LoimReader_$($env:LOIM_CI_VERSION)_windows_${{ matrix.arch }}.zip" `
            -Version $env:LOIM_CI_VERSION `
            -Architecture '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: loimreader-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          # Private-repo artifact storage is quota-limited; CI packages are
          # only needed for short-term inspection (releases keep theirs 30d).
          retention-days: 3

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DLOIM_BUILD_LEGACY_QT=OFF
          -DLOIM_BUILD_DESKTOP=OFF
          -DBUILD_TESTING=ON
          -DLOIM_ENABLE_STRICT_WARNINGS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build and test
        run: |
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure

  complete:
    name: All six targets passed
    if: always()
    needs: [build, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SANITIZER_RESULT" = success
